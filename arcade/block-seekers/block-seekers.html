<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bast's Voxel Hide & Seek</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #121216; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #viewport { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.7);
        }
        
        #hud {
            position: absolute; top: 16px; left: 16px; right: 16px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .stat-card { background: rgba(20, 20, 28, 0.75); padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; }
        .stat-value { font-size: 20px; font-weight: bold; color: #ffd700; }
        
        #alert-container { position: absolute; top: 75px; left: 50%; transform: translateX(-50%); width: 200px; text-align: center; pointer-events: none; }
        #alert-bar-bg { width: 100%; height: 10px; background: rgba(0,0,0,0.6); border-radius: 5px; overflow: hidden; border: 1px solid #444; }
        #alert-bar-fill { width: 0%; height: 100%; background: #ff3333; transition: width 0.1s linear; }

        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; text-align: center;
        }
        .btn {
            margin-top: 20px; padding: 12px 32px; font-size: 18px; font-weight: bold;
            background: #ffd700; color: #111; border: none; border-radius: 8px;
            cursor: pointer; transition: transform 0.1s, background 0.2s;
        }
        .btn:active { transform: scale(0.95); }

        #touch-controls {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            display: none; justify-content: space-between; pointer-events: none;
        }
        .dpad, .action-btn-group { display: grid; gap: 8px; pointer-events: auto; }
        .dpad { grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255,255,255,0.3);
            border-radius: 10px; color: white; font-weight: bold; font-size: 18px;
            display: flex; justify-content: center; align-items: center; touch-action: manipulation;
        }
        .ctrl-btn:active { background: rgba(255, 215, 0, 0.6); }
        .action-btn { width: 70px; height: 70px; border-radius: 35px; background: rgba(255, 215, 0, 0.3); border: 2px solid #ffd700; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="viewport"></div>
    <div class="vignette"></div>

    <div id="hud">
        <div class="stat-card">
            <div class="stat-label">Golden Mushrooms</div>
            <div class="stat-value" id="shroom-count">0 / 3</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Time Remaining</div>
            <div class="stat-value" id="timer-val">60s</div>
        </div>
    </div>

    <div id="alert-container">
        <div class="stat-label" style="margin-bottom:4px; color:#ff6666;">Spore Alert</div>
        <div id="alert-bar-bg"><div id="alert-bar-fill"></div></div>
    </div>

    <div id="start-screen" class="overlay-screen">
        <h1 style="color:#ffd700; font-size:32px; margin-bottom:10px;">Bast's Voxel Hide & Seek</h1>
        <p style="color:#ccc; max-width:320px; line-height:1.4;">Hide from Alastor behind voxel blocks! Collect 3 Golden Mushrooms and escape.</p>
        <button class="btn" onclick="startGame()">PLAY GAME</button>
    </div>

    <div id="game-over-screen" class="overlay-screen" style="display:none;">
        <h1 id="end-title" style="font-size:32px; margin-bottom:10px;">CAUGHT!</h1>
        <p id="end-desc" style="color:#ccc;">Alastor spotted Bast in the open!</p>
        <button class="btn" onclick="startGame()">RETRY</button>
    </div>

    <div id="touch-controls">
        <div class="dpad">
            <div></div><div class="ctrl-btn" id="btn-up">▲</div><div></div>
            <div class="ctrl-btn" id="btn-left">◄</div><div></div><div class="ctrl-btn" id="btn-right">►</div>
            <div></div><div class="ctrl-btn" id="btn-down">▼</div><div></div>
        </div>
        <div class="action-btn-group">
            <div class="ctrl-btn action-btn" id="btn-build">BUILD</div>
        </div>
    </div>

    <script>
        const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (AudioCtx.state === 'suspended') AudioCtx.resume();
            const osc = AudioCtx.createOscillator();
            const gain = AudioCtx.createGain();
            osc.connect(gain); gain.connect(AudioCtx.destination);
            
            if (type === 'build') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(150, AudioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, AudioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, AudioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.1);
                osc.start(); osc.stop(AudioCtx.currentTime + 0.1);
            } else if (type === 'collect') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, AudioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, AudioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, AudioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.25);
                osc.start(); osc.stop(AudioCtx.currentTime + 0.25);
            } else if (type === 'alert') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, AudioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, AudioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + 0.15);
                osc.start(); osc.stop(AudioCtx.currentTime + 0.15);
            }
        }

        const GRID_SIZE = 12;
        let scene, camera, renderer, bastMesh, alastorMesh, visionConeMesh;
        let grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
        let bastPos = { x: 1, z: 1 }, bastFacing = { x: 0, z: 1 };
        let alastorPos = { x: 10, z: 10 }, alastorAngle = 0;
        let mushrooms = [], mushroomsCollected = 0, alertMeter = 0, timer = 60, timerInterval, isPlaying = false;

        function init3D() {
            const container = document.getElementById('viewport');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x121216);

            const aspect = window.innerWidth / window.innerHeight;
            const d = 9;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            camera.position.set(12, 14, 12);
            camera.lookAt(0, 0, 0);

            const ambient = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xfff5ea, 0.8);
            dirLight.position.set(10, 20, 5);
            dirLight.castShadow = true;
            scene.add(dirLight);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            buildDioramaFloor();
            createBastMesh();
            createAlastorMesh();

            window.addEventListener('resize', onWindowResize);
            if ('ontouchstart' in window) document.getElementById('touch-controls').style.display = 'flex';
        }

        function buildDioramaFloor() {
            const geometry = new THREE.BoxGeometry(0.95, 0.4, 0.95);
            const material = new THREE.MeshStandardMaterial({ color: 0xd2c4b0, roughness: 0.8 });
            
            for (let x = 0; x < GRID_SIZE; x++) {
                for (let z = 0; z < GRID_SIZE; z++) {
                    const tile = new THREE.Mesh(geometry, material);
                    tile.position.set(x - GRID_SIZE/2 + 0.5, -0.2, z - GRID_SIZE/2 + 0.5);
                    tile.receiveShadow = true;
                    scene.add(tile);
                }
            }
        }

        function createBastMesh() {
            bastMesh = new THREE.Group();
            const matBlack = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 });
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 0.7, 8), matBlack); body.position.y = 0.35;
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 8), matBlack); head.position.y = 0.8;
            bastMesh.add(body, head);

            const matGreen = new THREE.MeshBasicMaterial({ color: 0x55ff55 });
            const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), matGreen); eyeL.position.set(0.1, 0.85, 0.22);
            const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), matGreen); eyeR.position.set(-0.1, 0.85, 0.22);
            bastMesh.add(eyeL, eyeR);

            const matGold = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
            const crown = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.25, 4), matGold); crown.position.set(0, 1.1, 0);
            const collar = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.05, 6, 12), matGold); collar.rotation.x = Math.PI/2; collar.position.y = 0.65;
            bastMesh.add(crown, collar);

            scene.add(bastMesh);
            updateMeshPos(bastMesh, bastPos);
        }

        function createAlastorMesh() {
            alastorMesh = new THREE.Group();
            const matShirt = new THREE.MeshStandardMaterial({ color: 0x101c2e });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.7, 0.4), matShirt); body.position.y = 0.35;
            alastorMesh.add(body);

            const matCap = new THREE.MeshStandardMaterial({ color: 0x6a2e13, roughness: 0.4 });
            const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.2, 0.3, 12), matCap); cap.position.y = 0.95;
            alastorMesh.add(cap);

            const coneGeo = new THREE.ConeGeometry(3.5, 6, 16, 1, true);
            const coneMat = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.25, side: THREE.DoubleSide });
            visionConeMesh = new THREE.Mesh(coneGeo, coneMat);
            visionConeMesh.rotation.x = Math.PI / 2;
            visionConeMesh.position.set(0, 0.1, 3);
            alastorMesh.add(visionConeMesh);

            scene.add(alastorMesh);
            updateMeshPos(alastorMesh, alastorPos);
        }

        function updateMeshPos(mesh, pos) {
            mesh.position.set(pos.x - GRID_SIZE/2 + 0.5, 0, pos.z - GRID_SIZE/2 + 0.5);
        }

        function spawnMushrooms() {
            mushrooms.forEach(m => scene.remove(m.mesh));
            mushrooms = [];
            for (let i = 0; i < 3; i++) {
                let rx, rz;
                do { rx = Math.floor(Math.random() * GRID_SIZE); rz = Math.floor(Math.random() * GRID_SIZE); }
                while ((rx === bastPos.x && rz === bastPos.z) || (rx === alastorPos.x && rz === alastorPos.z));

                const group = new THREE.Group();
                const cap = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffd700 }));
                cap.position.y = 0.25; group.add(cap);
                updateMeshPos(group, { x: rx, z: rz });
                scene.add(group);
                mushrooms.push({ x: rx, z: rz, mesh: group });
            }
        }

        function buildBlockInFront() {
            if (!isPlaying) return;
            const bx = bastPos.x + bastFacing.x;
            const bz = bastPos.z + bastFacing.z;
            if (bx >= 0 && bx < GRID_SIZE && bz >= 0 && bz < GRID_SIZE && !grid[bx][bz]) {
                const geo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
                const mat = new THREE.MeshStandardMaterial({ color: 0x8a9ea7, emissive: 0.6 });
                const block = new THREE.Mesh(geo, mat);
                block.castShadow = true; block.receiveShadow = true;
                updateMeshPos(block, { x: bx, z: bz }); block.position.y = 0.45;
                scene.add(block);
                grid[bx][bz] = block;
                playSound('build');
            }
        }

        function moveBast(dx, dz) {
            if (!isPlaying) return;
            bastFacing = { x: dx, z: dz };
            bastMesh.rotation.y = Math.atan2(dx, dz);
            const nx = bastPos.x + dx;
            const nz = bastPos.z + dz;
            if (nx >= 0 && nx < GRID_SIZE && nz >= 0 && nz < GRID_SIZE && !grid[nx][nz]) {
                bastPos = { x: nx, z: nz };
                updateMeshPos(bastMesh, bastPos);
                
                mushrooms.forEach((m, idx) => {
                    if (m.x === bastPos.x && m.z === bastPos.z) {
                        scene.remove(m.mesh);
                        mushrooms.splice(idx, 1);
                        mushroomsCollected++;
                        document.getElementById('shroom-count').innerText = `${mushroomsCollected} / 3`;
                        playSound('collect');
                        if (mushroomsCollected >= 3) endGame(true);
                    }
                });
            }
        }

        function updateAlastorAI() {
            alastorAngle += 0.03;
            alastorMesh.rotation.y = alastorAngle;

            const dx = bastPos.x - alastorPos.x;
            const dz = bastPos.z - alastorPos.z;
            const dist = Math.sqrt(dx*dx + dz*dz);
            const angleToBast = Math.atan2(dx, dz);
            let diffAngle = Math.abs(angleToBast - (alastorAngle % (Math.PI*2)));

            if (dist < 4.5 && diffAngle < 0.6) {
                let isBlocked = false;
                const stepX = Math.sign(dx), stepZ = Math.sign(dz);
                let cx = alastorPos.x + stepX, cz = alastorPos.y + stepZ;
                while (cx !== bastPos.x || cz !== bastPos.z) {
                    if (cx >= 0 && cx < GRID_SIZE && cz >= 0 && cz < GRID_SIZE && grid[cx][cz]) { isBlocked = true; break; }
                    if (cx !== bastPos.x) cx += stepX;
                    if (cz !== bastPos.z) cz += stepZ;
                }

                if (!isBlocked) {
                    alertMeter += 4;
                    playSound('alert');
                    if (alertMeter >= 100) endGame(false);
                }
            } else {
                alertMeter = Math.max(0, alertMeter - 1.5);
            }
            document.getElementById('alert-bar-fill').style.width = alertMeter + '%';
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';
            alertMeter = 0; timer = 60; mushroomsCollected = 0;
            document.getElementById('shroom-count').innerText = `0 / 3`;
            document.getElementById('timer-val').innerText = `60s`;
            
            for (let x=0; x<GRID_SIZE; x++) for (let z=0; z<GRID_SIZE; z++) if (grid[x][z]) { scene.remove(grid[x][z]); grid[x][z] = null; }
            
            bastPos = { x: 1, z: 1 }; updateMeshPos(bastMesh, bastPos);
            spawnMushrooms();
            isPlaying = true;

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPlaying) return;
                timer--;
                document.getElementById('timer-val').innerText = `${timer}s`;
                if (timer <= 0) endGame(false);
            }, 1000);
        }

        function endGame(victory) {
            isPlaying = false;
            clearInterval(timerInterval);
            document.getElementById('game-over-screen').style.display = 'flex';
            document.getElementById('end-title').innerText = victory ? "VICTORY!" : "CAUGHT!";
            document.getElementById('end-desc').innerText = victory ? "Bast gathered all mushrooms silently!" : "Spore Alert breached!";

            window.parent.postMessage({
                type: 'MUNCHING_CATS_MINIGAME_SCORE',
                game: 'block_seekers',
                score: victory ? (timer * 100) + 500 : mushroomsCollected * 100,
                victory: victory
            }, '*');
        }

        function renderLoop() {
            requestAnimationFrame(renderLoop);
            if (isPlaying) updateAlastorAI();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const d = 9;
            camera.left = -d * aspect; camera.right = d * aspect; camera.top = d; camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'ArrowUp') moveBast(0, -1);
            if (e.key === 's' || e.key === 'ArrowDown') moveBast(0, 1);
            if (e.key === 'a' || e.key === 'ArrowLeft') moveBast(-1, 0);
            if (e.key === 'd' || e.key === 'ArrowRight') moveBast(1, 0);
            if (e.key === ' ') buildBlockInFront();
        });

        document.getElementById('btn-up').onclick = () => moveBast(0, -1);
        document.getElementById('btn-down').onclick = () => moveBast(0, 1);
        document.getElementById('btn-left').onclick = () => moveBast(-1, 0);
        document.getElementById('btn-right').onclick = () => moveBast(1, 0);
        document.getElementById('btn-build').onclick = () => buildBlockInFront();

        init3D();
        renderLoop();
    </script>
</body>
</html>
